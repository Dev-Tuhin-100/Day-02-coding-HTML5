<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
    <!-- favicon -->
    <link rel= "icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <table border=1>
        <tr> <!-- tr = table row-->
            <th colspan="3">Student Information</th> <!-- table head-->
        </tr>
        <tr>
            <td>Jhon</td> <!-- table data-->
            <td>1</td>
            <td rowspan="4">CSE</td>
        </tr>
        <tr>
            <td>elish</td>
            <td>2</td>
        </tr>
         <tr>
            <td>mamun</td>
            <td>3</td>
        </tr>
         <tr>
            <td>kairul</td>
            <td>4</td>
        </tr>
    </table>
</body>
</html>
